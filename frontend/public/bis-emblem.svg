<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Outer circle badge -->
  <circle cx="50" cy="50" r="46" fill="url(#bisGrad)" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  
  <!-- ISI Shield / Diamond motif -->
  <polygon points="50,18 78,42 50,82 22,42" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Inner Standard Gear / Chakra -->
  <circle cx="50" cy="48" r="14" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="2"/>
  <circle cx="50" cy="48" r="5" fill="#f59e0b"/>
  
  <!-- BIS Letters text -->
  <text x="50" y="52" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">BIS</text>
  
  <!-- Ribbon base -->
  <path d="M 28 80 Q 50 88 72 80 L 68 88 Q 50 94 32 88 Z" fill="#d97706"/>
  <text x="50" y="86" font-family="'Inter', sans-serif" font-weight="700" font-size="6" fill="#ffffff" text-anchor="middle">मानक: पथप्रदर्शक:</text>
</svg>
